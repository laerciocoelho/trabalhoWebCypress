name: Testes E2E - Cypress

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Executar testes Cypress (apenas a spec do trabalho final)
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
          spec: cypress/e2e/automation-exercise.cy.js

      - name: Publicar relatório Mochawesome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-mochawesome
          path: cypress/reports
          if-no-files-found: warn

      - name: Publicar screenshots (somente falhas)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
